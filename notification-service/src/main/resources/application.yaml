spring:
  application:
    name: notification-service
server:
  address: 0.0.0.0
  port: 8083

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include:
          - health
          - info

microservices:
  hostnames:
    order-service-base-url: ${ORDER_SERVICE_BASE_URL:http://localhost:8082}
