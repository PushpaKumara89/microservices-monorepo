apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service-depl
  labels:
    app: notification-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
      - name: notification-service
        image: pushpakumara/notification-service:v20
        resources:
          limits:
            memory: "128Mi"
            cpu: "500m"
        ports:
        - containerPort: 8083
        startupProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8083
          failureThreshold: 25
          periodSeconds: 3
        livenessProbe:
          httpGet:
            path: /actuator/health/liveness
            port: 8083
          failureThreshold: 3
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /actuator/health/readiness
            port: 8083
          failureThreshold: 2
          periodSeconds: 5
        env:
          - name: ORDER_SERVICE_BASE_URL
            value: http://order-service-svc
          
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service-svc
  labels:
    app: notification-service
spec:
  selector:
    app: notification-service
  ports:
  - port: 80
    targetPort: 8083
