apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: myingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  rules:
  - host: spring-microservice-k8s.com
    http:
      paths:
      - path: "/order-service"
        pathType: Prefix
        backend:
          service:
            name: order-service-svc
            port: 
              number: 8082
      - path: "/product-service"
        pathType: Prefix
        backend:
          service:
            name: product-service-svc
            port: 
              number: 8081
      - path: "/notification-service"
        pathType: Prefix
        backend:
          service:
            name: notification-service
            port: 
              number: 8083
