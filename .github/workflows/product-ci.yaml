name: Product Service CI

# the magic is here
# run this CI only change product-service folder.
on:
  push:
    branches: [ main ]
    paths:
      - 'product-service/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'product-service/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      # Build and Test Spring Boot App
      - name: Build with Maven
        run: |
          cd product-service
          mvn clean package

      # Docker Build (next step will push the image to docker hub)
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./product-service
          file: ./product-service/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/product-service:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/product-service:v${{ github.run_number }}